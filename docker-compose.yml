# =============================================================================
# OpenClaw — Simple VPS-Style Container for EasyPanel (ARM64)
# =============================================================================
# Usage:
#   docker compose up -d
#   docker exec -it openclaw bash
#   openclaw onboard
# =============================================================================

services:
  openclaw:
    build:
      context: .
      dockerfile: Dockerfile
    image: openclaw-nanobyte:latest
    container_name: openclaw
    volumes:
      - openclaw-data:/root/.openclaw
    ports:
      - "3000:3000"
    init: true
    restart: unless-stopped

volumes:
  openclaw-data:
    driver: local
